; GeodesyKit 导出预设（仅三端：Windows / Android / iOS）
; 依据 docs/ARCHITECTURE.md §8；选项键名与序列化格式经 Godot 4.7 源码核实：
;   editor/export/editor_export.cpp:50-105（顶层键，export_filter 为字符串 "all_resources"）
;   editor/export/editor_export_platform_pc.cpp（custom_template/binary_format/texture_format 等 PC 公共键）
;   platform/windows/export/export_plugin.cpp（codesign/application 键）
;   platform/android/export/export_plugin.cpp（architectures 默认 arm64-v8a=true，见 :2223）
;   editor/export/editor_export_platform_apple_embedded.cpp（iOS application/capabilities/entitlements 键）
; 过滤器语法：逗号分隔通配符，matchn 匹配 res:// 与去前缀路径；不支持 "!" 前缀；
; 点开头目录（.godot/.mimosa/.zcode 等）本就不进导出，无需列出。
; 非资源文件（.json/.pgm）默认不进导出，故 include_filter 显式带上 data/ 与
; data/geoids/（EGM2008 格网为子目录须单独列出——M2 施工报告委托事项）。

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/geoids/*.pgm"
exclude_filter="*_research/*,_vendor_check/*,_scripts/*,docs/*,*.md"
export_path="build/windows/GeodesyKit.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
; 纯离线教学分发：签名默认关闭，需要时自备 .pfx/.p12 填入（勿提交密码）
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="GeodesyKit"
application/file_description="全离线测绘计算器（教学演示）"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Untitled"
ssh_remote_deploy/cleanup_script="Untitled"

